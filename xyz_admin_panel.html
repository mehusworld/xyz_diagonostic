<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ Diagnostic Center — ব্যবস্থাপনা প্যানেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --bg:#F6F8F7; --surface:#FFFFFF; --ink:#16231F; --ink-soft:#4B5A55;
  --teal-900:#0B3D3A; --teal-800:#0F4A45; --teal-700:#135E56; --teal-500:#1C8A7A;
  --mint-100:#E4F1EC; --mint-200:#D3E7DF;
  --amber-500:#F0A202; --amber-600:#D48A00;
  --coral:#E8542E; --coral-bg:#FDEEEA;
  --line:#DCE6E2; --shadow:0 8px 30px rgba(11,61,58,0.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:'Hind Siliguri',sans-serif; min-height:100vh; padding-bottom:70px;}
img,svg{display:block;}

header.top{
  background:linear-gradient(135deg, var(--teal-900), var(--teal-700) 65%, var(--teal-500));
  color:#fff; padding:26px 24px;
}
.top-inner{max-width:1080px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px;}
.brand .mark{width:44px;height:44px;border-radius:12px; background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.35); display:flex; align-items:center; justify-content:center; font-size:20px;}
.brand h1{font-family:'Fraunces',serif; font-weight:600; font-size:21px;}
.brand .tag{font-size:12px; opacity:0.85;}
.top-link{
  background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.35); color:#fff;
  padding:9px 16px; border-radius:10px; font-size:13px; text-decoration:none; font-weight:600;
}
.top-link:hover{background:rgba(255,255,255,0.24);}

main{max-width:1080px; margin:0 auto; padding:26px 20px;}

.tabs{display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
.tab-btn{
  padding:11px 20px; border-radius:11px; border:1.5px solid var(--line); background:#fff;
  font-weight:600; font-size:14px; cursor:pointer; color:var(--ink-soft); font-family:inherit;
}
.tab-btn.active{background:var(--teal-800); color:#fff; border-color:var(--teal-800);}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

.panel{background:var(--surface); border-radius:18px; box-shadow:var(--shadow); border:1px solid var(--line); padding:26px; margin-bottom:20px;}
.panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:10px;}
.panel-head h2{font-family:'Fraunces',serif; font-size:19px; color:var(--teal-900); font-weight:600;}
.panel .sub{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}

.btn{border:none; border-radius:10px; padding:11px 18px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px;}
.btn-add{background:var(--teal-800); color:#fff;}
.btn-add:hover{background:var(--teal-900);}
.btn-save{background:var(--amber-500); color:#3A2500;}
.btn-save:hover{background:var(--amber-600); color:#fff;}
.btn-cancel{background:#fff; color:var(--ink-soft); border:1.5px solid var(--line);}
.btn-cancel:hover{background:var(--mint-100);}
.btn-edit{background:var(--mint-100); color:var(--teal-800); padding:7px 12px; font-size:12.5px;}
.btn-edit:hover{background:var(--mint-200);}
.btn-del{background:var(--coral-bg); color:var(--coral); padding:7px 12px; font-size:12.5px;}
.btn-del:hover{background:#FBDCD3;}

/* --- entity cards list --- */
.entity-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-top:18px;}
.entity-card{border:1.5px solid var(--line); border-radius:14px; padding:16px; background:#FCFDFD; position:relative;}
.ec-top{display:flex; gap:12px; align-items:center;}
.ec-avatar{width:52px;height:52px;border-radius:50%; object-fit:cover; background:#eee; flex-shrink:0;}
.ec-name{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--teal-900);}
.ec-spec{font-size:12px; color:var(--teal-700); font-weight:600;}
.ec-meta{margin-top:10px; font-size:12px; color:var(--ink-soft); line-height:1.7; border-top:1px dashed var(--line); padding-top:9px;}
.ec-actions{display:flex; gap:8px; margin-top:12px;}
.vt-card{border:1.5px solid var(--line); border-radius:14px; padding:16px; background:#FCFDFD;}
.vt-card .vname{font-weight:700; font-size:14.5px; color:var(--teal-900);}
.vt-card .vdesc{font-size:12.5px; color:var(--ink-soft); margin:6px 0 8px;}
.vt-card .vfee{font-family:'Fraunces',serif; font-size:18px; color:var(--amber-600); font-weight:700;}

.empty-note{color:var(--ink-soft); font-size:13.5px; text-align:center; padding:26px 0;}

/* --- form modal --- */
.overlay{display:none; position:fixed; inset:0; background:rgba(11,20,18,0.5); z-index:50; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;}
.overlay.active{display:flex;}
.form-card{background:#fff; border-radius:18px; max-width:640px; width:100%; padding:28px; box-shadow:var(--shadow); margin-bottom:40px;}
.form-card h3{font-family:'Fraunces',serif; color:var(--teal-900); font-size:19px; margin-bottom:18px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.f-field{margin-bottom:14px;}
.f-field.full{grid-column:1/-1;}
.f-field label{display:block; font-size:12.5px; font-weight:600; color:var(--teal-900); margin-bottom:6px;}
.f-field input[type=text], .f-field input[type=number], .f-field input[type=time], .f-field textarea, .f-field select{
  width:100%; padding:10px 12px; border-radius:9px; border:1.5px solid var(--line); font-family:inherit; font-size:13.5px; background:#FCFDFD;
}
.f-field textarea{resize:vertical; min-height:60px;}
.f-field input:focus, .f-field textarea:focus, .f-field select:focus{outline:none; border-color:var(--teal-500);}
.day-check-row{display:flex; flex-wrap:wrap; gap:8px;}
.day-check{border:1.5px solid var(--line); border-radius:8px; padding:7px 11px; font-size:12.5px; cursor:pointer; user-select:none;}
.day-check.on{background:var(--mint-100); border-color:var(--teal-500); color:var(--teal-800); font-weight:600;}
.color-row{display:flex; gap:8px; align-items:center;}
.color-row input[type=color]{width:44px; height:38px; border:1.5px solid var(--line); border-radius:8px; cursor:pointer; padding:2px;}
.photo-row{display:flex; align-items:center; gap:14px;}
.photo-preview{width:64px;height:64px;border-radius:50%; object-fit:cover; background:#eee; border:1.5px solid var(--line);}
.form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}

.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--teal-900); color:#fff; padding:12px 22px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); z-index:100; display:none;}
.toast.show{display:block;}

.reset-row{text-align:center; margin-top:10px;}
.reset-row button{background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark">⚙</div>
      <div>
        <h1>XYZ Diagnostic Center</h1>
        <div class="tag">ব্যবস্থাপনা প্যানেল (Admin)</div>
      </div>
    </div>
    <a class="top-link" href="xyz_diagnostic_appointment.html">↗ সাইটে ফিরে যান</a>
  </div>
</header>

<main>

  <!-- DOCTORS -->
  <div class="tab-panel active" id="tab-doctors">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>ডাক্তার তালিকা</h2>
          <div class="sub">নতুন ডাক্তার যোগ করুন, তথ্য এডিট করুন, ছবি আপলোড করুন, প্রতিটি ভিজিট টাইপের ফি সেট করুন, অথবা মুছে ফেলুন।</div>
        </div>
        <button class="btn btn-add" id="addDoctorBtn">+ নতুন ডাক্তার যোগ করুন</button>
      </div>
      <div class="entity-list" id="doctorList"></div>
    </div>
  </div>

  <div class="reset-row">
    <button id="resetBtn">সব ডিফল্টে ফিরিয়ে নিন (রিসেট)</button>
  </div>

</main>

<!-- DOCTOR FORM MODAL -->
<div class="overlay" id="doctorOverlay">
  <div class="form-card">
    <h3 id="doctorFormTitle">নতুন ডাক্তার যোগ করুন</h3>
    <div class="photo-row" style="margin-bottom:16px;">
      <img id="photoPreview" class="photo-preview" src="" style="display:none;">
      <div id="photoPlaceholder" class="photo-preview" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:#999;">No Photo</div>
      <div>
        <input type="file" id="photoInput" accept="image/*">
        <div style="font-size:11px;color:var(--ink-soft); margin-top:4px;">ছবি না দিলে অটো আইকন দেখাবে</div>
      </div>
    </div>
    <div class="form-grid">
      <div class="f-field"><label>নাম (বাংলা)</label><input type="text" id="f_name" placeholder="ডা. কামাল হোসেন"></div>
      <div class="f-field"><label>Name (English)</label><input type="text" id="f_nameEn" placeholder="Dr. Kamal Hossain"></div>
      <div class="f-field"><label>বিশেষজ্ঞতা (বাংলা)</label><input type="text" id="f_specBn" placeholder="মেডিসিন বিশেষজ্ঞ"></div>
      <div class="f-field"><label>Specialty (English)</label><input type="text" id="f_specEn" placeholder="Medicine Specialist"></div>
      <div class="f-field full"><label>ডিগ্রি / Qualification</label><input type="text" id="f_qualif" placeholder="MBBS, MD (Medicine)"></div>
      <div class="f-field"><label>আইকন (ছবি না থাকলে)</label>
        <select id="f_icon">
          <option value="stethoscope">স্টেথোস্কোপ (সাধারণ)</option>
          <option value="heart">হৃদয় (হৃদরোগ)</option>
          <option value="bone">হাড় (অর্থোপেডিক)</option>
          <option value="baby">গাইনী / শিশু</option>
          <option value="skin">চর্ম</option>
        </select>
      </div>
      <div class="f-field"><label>থিম রঙ</label>
        <div class="color-row"><input type="color" id="f_color" value="#1C8A7A"></div>
      </div>
      <div class="f-field"><label>শুরুর সময়</label><input type="time" id="f_startTime" value="17:00"></div>
      <div class="f-field"><label>শেষের সময়</label><input type="time" id="f_endTime" value="21:00"></div>
      <div class="f-field full"><label>কোন কোন দিন বসেন</label>
        <div class="day-check-row" id="dayCheckRow"></div>
      </div>
      <div class="f-field"><label>প্রতিদিনের রোগী ধারণক্ষমতা (স্লট)</label><input type="number" id="f_capacity" min="1" value="20"></div>
    </div>
    <div class="f-field full" style="margin-top:6px;">
      <label>এই ডাক্তারের ভিজিট ফি (প্রতিটি ভিজিটের ধরন অনুযায়ী আলাদা)</label>
      <div class="form-grid" id="feeFieldsRow"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-cancel" id="doctorCancelBtn">বাতিল</button>
      <button class="btn btn-save" id="doctorSaveBtn">সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- CONSTANTS ---------------- */
const STORAGE_KEY_DOCTORS = 'xyzdc_doctors';
const STORAGE_KEY_VISITS = 'xyzdc_visitTypes';
const DAY_NAMES = ["রবি","সোম","মঙ্গল","বুধ","বৃহস্পতি","শুক্র","শনি"];

function toBn(num){
  const map = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
  return String(num).split('').map(ch=>map[ch] !== undefined ? map[ch] : ch).join('');
}

const ICONS = {
  heart: `<path d="M13 26 C4 20 4 10 12 8 C16 7 19 9 20 12 C21 9 24 7 28 8 C36 10 36 20 27 26 L20 32 Z" fill="#fff" opacity="0.9"/>`,
  bone: `<path d="M8 18 a4 4 0 1 1 6 -4 l16 16 a4 4 0 1 1 -6 4 Z" fill="#fff" opacity="0.9"/>`,
  baby: `<circle cx="20" cy="14" r="8" fill="#fff" opacity="0.9"/><path d="M8 34 C8 24 32 24 32 34" fill="#fff" opacity="0.9"/>`,
  skin: `<circle cx="14" cy="14" r="5" fill="#fff" opacity="0.85"/><circle cx="26" cy="20" r="7" fill="#fff" opacity="0.7"/><circle cx="16" cy="28" r="4" fill="#fff" opacity="0.6"/>`,
  stethoscope: `<path d="M10 6 v10 a8 8 0 0 0 16 0 V6" fill="none" stroke="#fff" stroke-width="2.4" opacity="0.9"/><circle cx="30" cy="26" r="4" fill="#fff" opacity="0.9"/>`
};
function avatarSVGDataUri(color, iconKey){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <circle cx="32" cy="32" r="31" fill="${color}22"/>
    <circle cx="32" cy="32" r="31" fill="none" stroke="${color}" stroke-width="1.4"/>
    <circle cx="32" cy="25" r="10" fill="${color}"/>
    <path d="M14 54 C14 40 50 40 50 54" fill="${color}"/>
    <g transform="translate(20,20) scale(0.9)">${ICONS[iconKey] || ICONS.stethoscope}</g>
  </svg>`;
  return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
}

const DEFAULT_DOCTORS = [
  {id:"kamal", name:"ডা. কামাল হোসেন", nameEn:"Dr. Kamal Hossain", specBn:"মেডিসিন বিশেষজ্ঞ", specEn:"Medicine Specialist", qualif:"MBBS, MD (Medicine)", color:"#1C8A7A", icon:"stethoscope", photo:"", days:[0,1,2,3], time:"বিকাল ৫টা – রাত ৯টা", startHour:17, endHour:21, capacity:20, fees:{new:600, followup:400, report:300}},
  {id:"nusrat", name:"ডা. নুসরাত জাহান", nameEn:"Dr. Nusrat Jahan", specBn:"গাইনী বিশেষজ্ঞ", specEn:"Gynecologist", qualif:"MBBS, FCPS (Gynae)", color:"#C6558B", icon:"baby", photo:"", days:[1,3,5], time:"সকাল ১০টা – দুপুর ২টা", startHour:10, endHour:14, capacity:15, fees:{new:800, followup:500, report:350}},
  {id:"rafiq", name:"ডা. রফিকুল ইসলাম", nameEn:"Dr. Rafiqul Islam", specBn:"হৃদরোগ বিশেষজ্ঞ", specEn:"Cardiologist", qualif:"MBBS, MD (Cardiology)", color:"#D4534A", icon:"heart", photo:"", days:[0,2,4], time:"সন্ধ্যা ৬টা – রাত ৯টা", startHour:18, endHour:21, capacity:12, fees:{new:1000, followup:600, report:400}},
  {id:"sabrina", name:"ডা. সাবরিনা আক্তার", nameEn:"Dr. Sabrina Akter", specBn:"চর্ম ও যৌন রোগ বিশেষজ্ঞ", specEn:"Dermatologist", qualif:"MBBS, DDV (Skin)", color:"#B98A2E", icon:"skin", photo:"", days:[2,3,5,6], time:"দুপুর ৩টা – সন্ধ্যা ৭টা", startHour:15, endHour:19, capacity:18, fees:{new:700, followup:450, report:300}},
  {id:"imran", name:"ডা. ইমরান চৌধুরী", nameEn:"Dr. Imran Chowdhury", specBn:"অর্থোপেডিক বিশেষজ্ঞ", specEn:"Orthopedic Surgeon", qualif:"MBBS, MS (Ortho)", color:"#3F6FA8", icon:"bone", photo:"", days:[0,1,4,6], time:"সকাল ৯টা – দুপুর ১টা", startHour:9, endHour:13, capacity:16, fees:{new:750, followup:450, report:300}}
];
const DEFAULT_VISIT_TYPES = [
  {id:"new", title:"১ম ভিজিট", desc:"নতুন রোগী হিসেবে প্রথমবার দেখাবেন", fee:600},
  {id:"followup", title:"২য় ভিজিট (ফলো-আপ)", desc:"আগে দেখানো রোগীর পুনরায় ভিজিট", fee:400},
  {id:"report", title:"রিপোর্ট দেখানো", desc:"টেস্ট রিপোর্ট নিয়ে পরামর্শ", fee:300}
];

/* ---------------- STORAGE ---------------- */
function normalizeDoctorFees(docArr, vtArr){
  docArr.forEach(doc=>{
    if(!doc.fees || typeof doc.fees !== 'object') doc.fees = {};
    vtArr.forEach(vt=>{
      if(doc.fees[vt.id] === undefined) doc.fees[vt.id] = vt.fee;
    });
  });
  return docArr;
}
function loadDoctors(){
  try{ const raw = localStorage.getItem(STORAGE_KEY_DOCTORS); if(raw){ const p = JSON.parse(raw); if(Array.isArray(p) && p.length) return normalizeDoctorFees(p, loadVisitTypes()); } }catch(e){}
  return normalizeDoctorFees(JSON.parse(JSON.stringify(DEFAULT_DOCTORS)), loadVisitTypes());
}
function loadVisitTypes(){
  try{ const raw = localStorage.getItem(STORAGE_KEY_VISITS); if(raw){ const p = JSON.parse(raw); if(Array.isArray(p) && p.length) return p; } }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_VISIT_TYPES));
}
function saveDoctors(){ localStorage.setItem(STORAGE_KEY_DOCTORS, JSON.stringify(doctors)); }
function saveVisitTypes(){ localStorage.setItem(STORAGE_KEY_VISITS, JSON.stringify(visitTypes)); }

let visitTypes = loadVisitTypes();
let doctors = normalizeDoctorFees(loadDoctors(), visitTypes);

/* ---------------- TOAST ---------------- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- (tabs removed — single doctor-management view) ---------------- */

/* ---------------- HELPERS ---------------- */
function hourLabel(h){
  let period;
  if(h>=4 && h<6) period='ভোর';
  else if(h>=6 && h<12) period='সকাল';
  else if(h>=12 && h<15) period='দুপুর';
  else if(h>=15 && h<18) period='বিকাল';
  else if(h>=18 && h<20) period='সন্ধ্যা';
  else period='রাত';
  let h12 = h % 12; if(h12===0) h12 = 12;
  return `${period} ${toBn(h12)}টা`;
}
function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,16) || 'doc';
}
function uniqueId(base, existingArr){
  let id = base, i = 1;
  while(existingArr.some(x=>x.id===id)){ id = base + (++i); }
  return id;
}

/* ---------------- RENDER: DOCTOR LIST ---------------- */
function renderDoctorList(){
  const list = document.getElementById('doctorList');
  list.innerHTML = '';
  if(!doctors.length){
    list.innerHTML = '<div class="empty-note">এখনো কোনো ডাক্তার যোগ করা হয়নি।</div>';
    return;
  }
  doctors.forEach(doc=>{
    const dayList = doc.days.map(d=>DAY_NAMES[d]).join(', ');
    const card = document.createElement('div');
    card.className = 'entity-card';
    const avatarSrc = doc.photo || avatarSVGDataUri(doc.color, doc.icon);
    card.innerHTML = `
      <div class="ec-top">
        <img class="ec-avatar" src="${avatarSrc}">
        <div>
          <div class="ec-name">${doc.name}</div>
          <div class="ec-spec">${doc.specBn}</div>
        </div>
      </div>
      <div class="ec-meta">
        <div>${doc.qualif}</div>
        <div>বসেন: ${dayList}</div>
        <div>সময়: ${doc.time}</div>
        <div>ধারণক্ষমতা: ${toBn(doc.capacity)} জন/দিন</div>
        <div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);">
          ${visitTypes.map(vt=>`${vt.title}: <b>৳${toBn(doc.fees && doc.fees[vt.id] !== undefined ? doc.fees[vt.id] : vt.fee)}</b>`).join(' • ')}
        </div>
      </div>
      <div class="ec-actions">
        <button class="btn btn-edit" data-id="${doc.id}" data-action="edit">✏️ এডিট</button>
        <button class="btn btn-del" data-id="${doc.id}" data-action="delete">🗑️ ডিলিট</button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('[data-action="edit"]').forEach(b=>b.addEventListener('click', ()=>openDoctorForm(b.dataset.id)));
  list.querySelectorAll('[data-action="delete"]').forEach(b=>b.addEventListener('click', ()=>deleteDoctor(b.dataset.id)));
}

/* ---------------- DOCTOR FORM ---------------- */
const dayCheckRow = document.getElementById('dayCheckRow');
let selectedDays = new Set();
DAY_NAMES.forEach((name, idx)=>{
  const chip = document.createElement('div');
  chip.className = 'day-check';
  chip.textContent = name;
  chip.dataset.day = idx;
  chip.addEventListener('click', ()=>{
    if(selectedDays.has(idx)) selectedDays.delete(idx); else selectedDays.add(idx);
    chip.classList.toggle('on', selectedDays.has(idx));
  });
  dayCheckRow.appendChild(chip);
});

let editingDoctorId = null;
let pendingPhoto = "";

function openDoctorForm(id){
  editingDoctorId = id || null;
  const doc = id ? doctors.find(d=>d.id===id) : null;
  document.getElementById('doctorFormTitle').textContent = doc ? 'ডাক্তার এডিট করুন' : 'নতুন ডাক্তার যোগ করুন';

  document.getElementById('f_name').value = doc ? doc.name : '';
  document.getElementById('f_nameEn').value = doc ? doc.nameEn : '';
  document.getElementById('f_specBn').value = doc ? doc.specBn : '';
  document.getElementById('f_specEn').value = doc ? doc.specEn : '';
  document.getElementById('f_qualif').value = doc ? doc.qualif : '';
  document.getElementById('f_icon').value = doc ? doc.icon : 'stethoscope';
  document.getElementById('f_color').value = doc ? doc.color : '#1C8A7A';
  document.getElementById('f_startTime').value = doc ? String(doc.startHour).padStart(2,'0')+':00' : '17:00';
  document.getElementById('f_endTime').value = doc ? String(doc.endHour).padStart(2,'0')+':00' : '21:00';
  document.getElementById('f_capacity').value = doc ? doc.capacity : 20;

  selectedDays = new Set(doc ? doc.days : []);
  dayCheckRow.querySelectorAll('.day-check').forEach(chip=>{
    chip.classList.toggle('on', selectedDays.has(Number(chip.dataset.day)));
  });

  pendingPhoto = doc ? (doc.photo || "") : "";
  updatePhotoPreview();
  document.getElementById('photoInput').value = '';

  const feeRow = document.getElementById('feeFieldsRow');
  feeRow.innerHTML = '';
  visitTypes.forEach(vt=>{
    const val = doc && doc.fees && doc.fees[vt.id] !== undefined ? doc.fees[vt.id] : vt.fee;
    const wrap = document.createElement('div');
    wrap.className = 'f-field';
    wrap.innerHTML = `<label>${vt.title}</label><input type="number" min="0" class="fee-input" data-vt="${vt.id}" value="${val}">`;
    feeRow.appendChild(wrap);
  });

  document.getElementById('doctorOverlay').classList.add('active');
}

function updatePhotoPreview(){
  const img = document.getElementById('photoPreview');
  const ph = document.getElementById('photoPlaceholder');
  if(pendingPhoto){
    img.src = pendingPhoto; img.style.display='block'; ph.style.display='none';
  } else {
    img.style.display='none'; ph.style.display='flex';
  }
}

document.getElementById('photoInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      // resize/compress to keep localStorage small
      const maxSize = 300;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize/w); w = maxSize; } }
      else { if(h > maxSize){ w = Math.round(w * maxSize/h); h = maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.85);
      updatePhotoPreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('addDoctorBtn').addEventListener('click', ()=>openDoctorForm(null));
document.getElementById('doctorCancelBtn').addEventListener('click', ()=>document.getElementById('doctorOverlay').classList.remove('active'));

document.getElementById('doctorSaveBtn').addEventListener('click', ()=>{
  const name = document.getElementById('f_name').value.trim();
  const nameEn = document.getElementById('f_nameEn').value.trim();
  const specBn = document.getElementById('f_specBn').value.trim();
  const specEn = document.getElementById('f_specEn').value.trim();
  const qualif = document.getElementById('f_qualif').value.trim();
  const icon = document.getElementById('f_icon').value;
  const color = document.getElementById('f_color').value;
  const startHour = parseInt(document.getElementById('f_startTime').value.split(':')[0], 10);
  const endHour = parseInt(document.getElementById('f_endTime').value.split(':')[0], 10);
  const capacity = parseInt(document.getElementById('f_capacity').value, 10) || 1;
  const days = Array.from(selectedDays).sort();

  if(!name || !specBn || days.length===0){
    alert('অনুগ্রহ করে অন্তত নাম, বিশেষজ্ঞতা ও বসার দিন দিন।');
    return;
  }

  const time = `${hourLabel(startHour)} – ${hourLabel(endHour)}`;

  const fees = {};
  document.querySelectorAll('#feeFieldsRow .fee-input').forEach(inp=>{
    fees[inp.dataset.vt] = parseInt(inp.value, 10) || 0;
  });

  if(editingDoctorId){
    const doc = doctors.find(d=>d.id===editingDoctorId);
    Object.assign(doc, {name, nameEn, specBn, specEn, qualif, icon, color, startHour, endHour, capacity, days, time, photo: pendingPhoto, fees});
  } else {
    const id = uniqueId(slugify(nameEn || name), doctors);
    doctors.push({id, name, nameEn, specBn, specEn, qualif, icon, color, startHour, endHour, capacity, days, time, photo: pendingPhoto, fees});
  }

  saveDoctors();
  renderDoctorList();
  document.getElementById('doctorOverlay').classList.remove('active');
  showToast('ডাক্তারের তথ্য সংরক্ষণ হয়েছে ✓');
});

function deleteDoctor(id){
  const doc = doctors.find(d=>d.id===id);
  if(!confirm(`"${doc.name}" কে তালিকা থেকে মুছে ফেলতে চান?`)) return;
  doctors = doctors.filter(d=>d.id!==id);
  saveDoctors();
  renderDoctorList();
  showToast('ডাক্তার মুছে ফেলা হয়েছে');
}

/* ---------------- RESET ---------------- */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('সব ডাক্তার ডিফল্ট ডেমো ডেটায় ফিরিয়ে নিতে চান? এই কাজ পূর্বাবস্থায় ফেরানো যাবে না।')) return;
  localStorage.removeItem(STORAGE_KEY_DOCTORS);
  localStorage.removeItem(STORAGE_KEY_VISITS);
  visitTypes = loadVisitTypes();
  doctors = loadDoctors();
  renderDoctorList();
  showToast('ডিফল্ট ডেটায় ফিরিয়ে নেওয়া হয়েছে');
});

/* ---------------- INIT ---------------- */
renderDoctorList();
</script>
